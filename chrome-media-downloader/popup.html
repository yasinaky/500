<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Medya İndirici</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="icons/icon32.png" alt=""> Medya İndirici</div>
    <select id="scope" title="Nereden taransın?">
      <option value="current">Bu sekme</option>
      <option value="window">Bu penceredeki tüm sekmeler</option>
      <option value="all">Tüm pencereler / tüm sekmeler</option>
    </select>
    <button id="scan" class="primary">Tara</button>
    <span class="spacer"></span>
    <button id="toggleSettings" title="Ayarlar">⚙ Ayarlar</button>
    <button id="detach" title="Büyük pencerede aç">⤢</button>
  </header>

  <section class="filters">
    <label class="chip"><input type="checkbox" id="showImages"> Resimler <b id="cntImg">0</b></label>
    <label class="chip"><input type="checkbox" id="showVideos"> Videolar <b id="cntVid">0</b></label>
    <label class="num">En az <input type="number" id="minW" min="0" step="50"> × <input type="number" id="minH" min="0" step="50"> px</label>
    <label>Kalite
      <select id="quality">
        <option value="max">En yüksek</option>
        <option value="2160">≤ 2160p / 4K</option>
        <option value="1440">≤ 1440p</option>
        <option value="1080">≤ 1080p</option>
        <option value="720">≤ 720p</option>
        <option value="480">≤ 480p</option>
        <option value="360">≤ 360p</option>
        <option value="min">En düşük</option>
      </select>
    </label>
    <label>Sırala
      <select id="sort">
        <option value="area">Çözünürlük (büyük → küçük)</option>
        <option value="bytes">Dosya boyutu (büyük → küçük)</option>
        <option value="page">Sayfadaki sıra</option>
        <option value="type">Türe göre</option>
      </select>
    </label>
    <input type="search" id="search" placeholder="Ara (ad, adres, sekme)…">
    <div id="formats" class="formats"></div>
  </section>

  <section id="settings" class="settings" hidden>
    <label>Klasör
      <input type="text" id="folder" title="İndirilenler klasörünün içinde. {site} {date} {title} kullanılabilir">
    </label>
    <label>Dosya adı
      <select id="naming">
        <option value="original">Orijinal ad</option>
        <option value="site">site_001</option>
        <option value="title">sayfa-başlığı_001</option>
      </select>
    </label>
    <label>Resim formatı
      <select id="convert">
        <option value="original">Orijinal</option>
        <option value="jpg">JPG'ye dönüştür</option>
        <option value="png">PNG'ye dönüştür</option>
        <option value="webp">WEBP'ye dönüştür</option>
      </select>
    </label>
    <label id="qWrap">Kalite <input type="range" id="jpgQuality" min="50" max="100"> <span id="jpgQualityVal"></span>%</label>
    <label>Aynı anda <input type="number" id="parallel" min="1" max="8" style="width:46px"> indirme</label>
    <label class="chip"><input type="checkbox" id="saveAs"> Konumu her seferinde sor</label>
    <label class="chip"><input type="checkbox" id="dedupe"> Kopyaları birleştir</label>
  </section>

  <div id="notice" class="notice" hidden></div>

  <main id="grid" class="grid">
    <div class="empty">Taramak için <b>Tara</b>'ya basın.</div>
  </main>

  <footer class="bar">
    <button id="selAll">Tümünü seç</button>
    <button id="selNone">Hiçbiri</button>
    <button id="selInvert">Ters çevir</button>
    <span id="summary" class="summary">0 seçili</span>
    <span class="spacer"></span>
    <div id="progress" class="progress" hidden><div></div><span></span></div>
    <button id="copy">Linkleri kopyala</button>
    <button id="download" class="primary" disabled>İndir</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
